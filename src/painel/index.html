<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar KXP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script>try { const t = localStorage.getItem('radar-tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* sem storage */ }</script>
<style>
  :root {
    --bg: #F3F4F8;
    --surface: #FFFFFF;
    --surface-2: #F7F7FB;
    --ink: #171A2B;
    --muted: #5F667D;
    --faint: #8A90A6;
    --line: #E1E3EC;
    --accent: #4B3FD6;
    --accent-ink: #FFFFFF;
    --accent-soft: #ECEAFD;
    --t-image: #E6E8F1;   --t-image-ink: #2E3350;   --t-image-bar: #7B83A8;
    --t-car: #E2F2EB;     --t-car-ink: #1D5A44;     --t-car-bar: #2F9D74;
    --t-reel: #FCEAE5;    --t-reel-ink: #8B301E;    --t-reel-bar: #E0664A;
    --mark: #FFE58A;
    --shadow: 0 1px 2px rgba(23, 26, 43, .06), 0 10px 26px -14px rgba(23, 26, 43, .22);
    --scrim: rgba(12, 14, 28, .55);
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1120; --surface: #181B2D; --surface-2: #1F2238; --ink: #ECEEF7; --muted: #A1A7BF; --faint: #6F7591; --line: #2B2F47;
      --accent: #A39AFF; --accent-ink: #15123A; --accent-soft: #27244D;
      --t-image: #2A2E47; --t-image-ink: #CDD2EA; --t-image-bar: #8F97BD;
      --t-car: #173629;   --t-car-ink: #A3E4C8;   --t-car-bar: #4CC196;
      --t-reel: #3C1F19;  --t-reel-ink: #FFB6A5;  --t-reel-bar: #F08A6F;
      --mark: #6C5A12;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -14px rgba(0, 0, 0, .7);
      --scrim: rgba(3, 4, 12, .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1120; --surface: #181B2D; --surface-2: #1F2238; --ink: #ECEEF7; --muted: #A1A7BF; --faint: #6F7591; --line: #2B2F47;
    --accent: #A39AFF; --accent-ink: #15123A; --accent-soft: #27244D;
    --t-image: #2A2E47; --t-image-ink: #CDD2EA; --t-image-bar: #8F97BD;
    --t-car: #173629;   --t-car-ink: #A3E4C8;   --t-car-bar: #4CC196;
    --t-reel: #3C1F19;  --t-reel-ink: #FFB6A5;  --t-reel-bar: #F08A6F;
    --mark: #6C5A12;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -14px rgba(0, 0, 0, .7);
    --scrim: rgba(3, 4, 12, .7);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 24px 72px; }

  /* menu lateral */
  body { margin: 0; }
  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { position: sticky; top: 0; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; background: var(--surface); border-right: 1px solid var(--line); z-index: 50; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; letter-spacing: -.01em; padding: 2px 6px; white-space: nowrap; }
  .logo { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: #fff; }
  .sidebar .cx-conta > summary { width: 100%; box-sizing: border-box; border-radius: 12px; padding: 8px 10px 8px 8px; }
  .sidebar .cx-conta > summary svg { margin-left: auto; }
  .sidebar .cx-conta-l { left: 0; right: 0; min-width: 0; }
  .sidenav { display: flex; flex-direction: column; gap: 2px; }
  .sidenav-tit { font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint, var(--muted)); padding: 6px 10px 8px; }
  .sidenav button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 600; padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left; }
  .sidenav button svg { flex: 0 0 auto; }
  .sidenav button:hover { background: var(--surface-2); color: var(--ink); }
  .sidenav button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
  .sidenav .n { margin-left: auto; font-family: var(--mono); font-size: 11.5px; font-weight: 600; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 8px; }
  .sidenav .n:empty { display: none; }
  .side-fim { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  #cx-status { font-size: 13px; line-height: 1.45; color: var(--muted); padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
  #cx-status:empty { display: none; }
  #cx-status b { color: var(--ink); }
  #cx-status .ponto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); vertical-align: middle; }
  #cx-status .ponto.rodando { background: var(--accent); animation: pulsar 1.2s ease-in-out infinite; }
  #cx-status .ponto.ok { background: #2E9E6A; }
  #cx-status .ponto.erro { background: var(--t-reel-ink, #c33); }
  #cx-status .log { display: block; margin-top: 4px; font: 11.5px/1.4 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes pulsar { 50% { opacity: .35; } }
  .side-btn { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 10px; cursor: pointer; text-align: left; }
  .side-btn:hover { background: var(--surface-2); color: var(--ink); }
  .side-btn small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .side-btn.girando svg { animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .main { min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 14px; min-height: 64px; box-sizing: border-box; padding: 10px clamp(16px, 4vw, 40px); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
  .topbar-tit { min-width: 0; }
  .topbar-tit h1 { font-family: var(--display); font-size: 20px; line-height: 1.2; letter-spacing: -.01em; margin: 0; }
  .topbar-tit p { margin: 2px 0 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-tit p:empty { display: none; }
  .topbar-dir { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .icon-btn:hover { color: var(--ink); }
  #tema .i-lua { display: none; }
  .tema-claro #tema .i-sol { display: none; }
  .tema-claro #tema .i-lua { display: block; }
  .icon-btn.girando svg { animation: girar .8s linear infinite; }
  .menu-btn { display: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); place-items: center; cursor: pointer; }
  .scrim-menu { display: none; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; left: 0; top: 0; width: 272px; transform: translateX(-100%); transition: transform .2s ease; box-shadow: 0 0 40px -10px rgba(0,0,0,.4); }
    .app.menu-aberto .sidebar { transform: none; }
    .app.menu-aberto .scrim-menu { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 45; }
    .menu-btn { display: grid; }
    .topbar { padding-inline: 16px; }
    .topbar .cx-cnome { display: none; }
    .topbar .cx-split-pri { font-size: 0; gap: 0; padding: 0 12px; }
    .topbar .cx-split-pri svg, .topbar .cx-split-pri .cx-ponto { font-size: 14px; }
  }

  svg { flex: none; }

  /* cabecalho */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 5.2vw, 54px); line-height: 1.02; letter-spacing: -.025em; margin: 8px 0 12px; text-wrap: balance; }
  .lede { margin: 0; max-width: 62ch; color: var(--muted); font-size: 16px; }
  .stamp { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; line-height: 1.7; }
  .stamp b { color: var(--ink); font-weight: 500; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .reload {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink);
    font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;
  }
  .reload:hover { border-color: var(--accent); color: var(--accent); }
  .reload[disabled] { opacity: .55; cursor: progress; }
  .reload[disabled] svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* numeros */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 30px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 15px; display: flex; flex-direction: column; gap: 2px; }
  .kpi b { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi b small { font-size: 18px; color: var(--faint); font-weight: 500; letter-spacing: 0; }
  .kpi span { color: var(--muted); font-size: 13.5px; }

  .mix { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
  .bar { flex: 1 1 280px; display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); }
  .bar i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .legend b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* barra de ferramentas */
  .toolbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-top: 28px; padding-block: 12px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .search { position: relative; flex: 1 1 280px; min-width: 0; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .search input {
    width: 100%; height: 40px; padding: 0 12px 0 38px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
    font: inherit; font-size: 14.5px;
  }
  .search input::placeholder { color: var(--faint); }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .seg button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13.5px; font-weight: 500;
    padding: 6px 12px; border-radius: 7px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); cursor: pointer; user-select: none; padding: 0 4px; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  select {
    height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer;
  }
  :is(input, select, button):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .count { margin: 14px 0 12px; font-size: 13px; color: var(--muted); }

  /* grade */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(158px, 42vw, 222px), 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
    border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: inherit; font: inherit;
    cursor: pointer; transition: transform .16s ease, box-shadow .16s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { position: relative; aspect-ratio: 4 / 5; background: var(--surface-2); max-width: 100%; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tchip {
    position: absolute; top: 8px; left: 8px;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  }
  .t-image { background: var(--t-image); color: var(--t-image-ink); }
  .t-carousel { background: var(--t-car); color: var(--t-car-ink); }
  .t-reel, .t-video { background: var(--t-reel); color: var(--t-reel-ink); }
  .trflag {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
  }
  .slides {
    position: absolute; bottom: 8px; right: 8px; font-family: var(--mono); font-size: 11px;
    background: rgba(10, 12, 24, .62); color: #fff; border-radius: 6px; padding: 2px 6px;
  }
  .cbody { padding: 11px 12px 14px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .who { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
  .who .v { color: var(--accent); }
  .metrics { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .metrics span { display: inline-flex; align-items: center; gap: 4px; }
  .cap {
    margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
  }
  .cap .from { color: var(--accent); font-weight: 600; }
  .cap.empty { color: var(--faint); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
  .chip {
    font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

  .empty-state { grid-column: 1 / -1; text-align: center; padding: 56px 16px; color: var(--muted); }
  .empty-state b { display: block; font-family: var(--display); font-size: 20px; color: var(--ink); margin-bottom: 4px; }

  .foot { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--faint); max-width: 80ch; }

  /* detalhe */
  dialog#detail {
    border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--ink);
    width: min(1000px, calc(100vw - 32px)); max-height: min(90vh, 920px); overflow: hidden;
    box-shadow: 0 30px 90px -24px rgba(0, 0, 0, .5);
  }
  dialog#detail::backdrop { background: var(--scrim); }
  .dgrid { display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); max-height: min(90vh, 920px); }
  /* item de grid cresce ate o conteudo por padrao; sem o teto cada coluna vaza
     do dialog (que corta com overflow hidden) e a rolagem nunca aparece */
  .dgrid > .dmedia, .dgrid > .dinfo { min-height: 0; max-height: min(90vh, 920px); }
  .dinfo { overscroll-behavior: contain; }
  .dmedia { background: var(--surface-2); overflow: auto; display: flex; flex-direction: column; }
  .viewer { position: relative; display: grid; place-items: center; background: #0B0C16; min-height: 220px; }
  .viewer img, .viewer video { width: 100%; height: auto; max-height: min(72vh, 720px); object-fit: contain; display: block; }
  .viewer .nada { color: #9AA0B8; font-size: 13px; padding: 40px 16px; text-align: center; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 1;
    width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center;
    background: rgba(10, 12, 24, .6); color: #fff; cursor: pointer;
  }
  .nav:hover { background: rgba(10, 12, 24, .82); }
  .nav.prev { left: 10px; }
  .nav.next { right: 10px; }
  .nav[disabled] { opacity: .25; cursor: default; }
  .counter {
    position: absolute; top: 10px; left: 10px; z-index: 1; font-family: var(--mono); font-size: 11.5px;
    background: rgba(10, 12, 24, .62); color: #fff; border-radius: 6px; padding: 2px 8px;
  }
  .strip { display: flex; gap: 6px; padding: 10px; overflow-x: auto; }
  .strip button {
    position: relative; flex: none; width: 50px; height: 62px; padding: 0; overflow: hidden; cursor: pointer;
    border: 2px solid transparent; border-radius: 8px; background: var(--line); color: var(--muted);
  }
  .strip button[aria-current="true"] { border-color: var(--accent); }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .strip .play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; background: rgba(10, 12, 24, .35); }
  .dinfo { padding: 24px 26px 30px; overflow: auto; }
  .close {
    position: absolute; top: 12px; right: 12px; z-index: 2; width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .dwho { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: -.015em; margin: 0 44px 2px 0; overflow-wrap: anywhere; }
  .dmeta { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .dmeta .dot { color: var(--faint); }
  .ext { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); font-weight: 600; text-decoration: none; }
  .ext:hover { text-decoration: underline; }
  .dmetrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(116px, 1fr)); gap: 10px; margin: 18px 0 4px; padding: 0; }
  .dmetrics div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .dmetrics dt { font-size: 12px; color: var(--muted); }
  .dmetrics dd { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
  .dsec h3 { font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  .pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.62; margin: 0; max-width: 68ch; }
  .src { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .src-label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
  .src-label small { color: var(--faint); font-weight: 400; }
  .src p { margin: 0; font-size: 14.5px; line-height: 1.62; overflow-wrap: anywhere; }
  .src p.none { color: var(--faint); font-style: italic; }
  .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 18px; margin: 0; font-size: 14px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }

  .hit { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 12.5px; color: var(--ink); line-height: 1.35; }
  .hit svg { color: var(--accent); }
  .hit b { font-weight: 600; color: var(--accent); }
  .hit .more { color: var(--muted); font-size: 11.5px; }
  .pub { font-size: 12px; color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; }
  .filters select { flex: 0 1 auto; max-width: 100%; }
  .clear { border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 0 6px; }
  table.t.hits { font-size: 13.5px; }
  table.t tbody tr.runlink { cursor: pointer; }
  table.t tbody tr.runlink:hover td { background: var(--surface-2); }

  .chip.prof { background: var(--t-reel); border-color: transparent; color: var(--t-reel-ink); }
  .wbtns { display: inline-flex; gap: 4px; }
  .wbtn { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 600; border-radius: 7px; padding: 3px 9px; cursor: pointer; white-space: nowrap; }
  .wbtn:hover { border-color: var(--accent); color: var(--accent); }
  .wbtn[aria-pressed="true"].w-acompanhar { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .wbtn[aria-pressed="true"].w-ignorar { background: var(--surface-2); color: var(--ink); border-color: var(--ink); }
  tr.ignorado td { opacity: .5; }
  .bio { white-space: pre-wrap; font-size: 14px; color: var(--ink); margin: 10px 0 0; max-width: 70ch; }
  .motivos { color: var(--muted); font-size: 12.5px; }

  .pill.k-concorrente { background: var(--t-reel); color: var(--t-reel-ink); }
  .pill.k-referencia_lideranca, .pill.k-referencia_produto { background: var(--accent-soft); color: var(--accent); }
  .pill.k-publico { background: var(--t-car); color: var(--t-car-ink); }
  .pill.k-fora, .pill.k-nada { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  .pill .conf { font-weight: 500; opacity: .75; margin-left: 4px; }
  .rev { color: var(--t-reel-ink); font-weight: 700; margin-left: 3px; }
  .you { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; margin-left: 5px; opacity: .8; }
  .chip.ia-alta { background: var(--t-car); border-color: transparent; color: var(--t-car-ink); font-weight: 600; }
  .chip.ia-media { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .iabadge { position: absolute; left: 8px; bottom: 8px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .iabadge.ia-alta { background: var(--t-car-bar); color: #fff; }
  .iabadge.ia-media { background: var(--accent); color: var(--accent-ink); }
  .iabadge.ia-baixa { background: rgba(10, 12, 24, .62); color: #fff; }
  .chip.ia-baixa { background: var(--surface-2); color: var(--muted); border-color: var(--line); }
  .iabox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 20px; margin-top: 18px; }
  .iabox .h2 { margin: 4px 0 6px; font-size: 19px; }
  .iabox p { margin: 0 0 12px; color: var(--muted); font-size: 14px; max-width: 80ch; }
  .iarow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .iabox textarea { width: 100%; min-height: 220px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font: 12.5px/1.5 var(--mono); padding: 10px 12px; }
  .iabox input[type=text] { height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; padding: 0 10px; }
  .btn-pri { height: 36px; padding: 0 16px; border-radius: 9px; border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-pri[disabled] { opacity: .5; cursor: default; }
  .iares { font-size: 14px; }
  .iares.ok { color: var(--t-car-ink); }
  .iares.bad { color: var(--t-reel-ink); }
  .iabox pre { margin: 8px 0 0; white-space: pre-wrap; font: 12.5px/1.5 var(--mono); color: var(--t-reel-ink); }
  .fix { height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; padding: 0 8px; }
  .iasec { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
  .iasec p { margin: 6px 0 0; font-size: 14px; line-height: 1.55; }

  /* abas */
  .tabs { display: flex; gap: 4px; margin-top: 28px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 600;
    padding: 10px 14px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .n { font-family: var(--mono); font-size: 11.5px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 0 7px; }
  .tabs button[aria-selected="true"] .n { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

  /* tabelas */
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th { text-align: left; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
  table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  table.t tbody tr.click { cursor: pointer; }
  table.t tbody tr.click:hover td { background: var(--surface-2); }
  .acc { font-weight: 600; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .acc .v { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12.5px; max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank { font-family: var(--mono); color: var(--faint); font-size: 12px; }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .p-ok { background: var(--t-car); color: var(--t-car-ink); }
  .p-bad { background: var(--t-reel); color: var(--t-reel-ink); }
  .p-run { background: var(--accent-soft); color: var(--accent); }
  .p-kind { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
  .chip.term { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .chip.exp { background: var(--t-car); border-color: transparent; color: var(--t-car-ink); }
  .chip.lang { font-family: var(--mono); text-transform: uppercase; font-size: 10.5px; }
  .why { color: var(--muted); font-size: 13px; max-width: 40ch; }
  .h2 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; margin: 34px 0 12px; }
  .daynav { display: flex; align-items: center; gap: 10px; margin-top: 26px; }
  .daynav b { font-family: var(--display); font-size: 22px; font-weight: 700; min-width: 12ch; }
  .daynav button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  .daynav button[disabled] { opacity: .35; cursor: default; }
  .next-mark { color: var(--accent); font-weight: 700; }
  .aview { grid-column: 1 / -1; padding: 26px 28px 30px; overflow: auto; max-height: min(90vh, 920px); }
  .aview .grid { margin-top: 18px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .back { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; border-radius: 8px; padding: 5px 10px; cursor: pointer; margin-bottom: 12px; }

  @media (max-width: 760px) {
    dialog#detail { overflow: auto; }
    .dgrid { grid-template-columns: 1fr; max-height: none; }
    .viewer img, .viewer video { max-height: 52vh; }
    .dinfo { overflow: visible; padding: 20px 18px 26px; }
    .dgrid > .dmedia, .dgrid > .dinfo { max-height: none; }
    .stamp { text-align: left; }
    .side { align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" aria-label="Menu">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></svg></span>Radar de conteúdo</a>
    <nav class="sidenav" id="tabs" role="tablist" aria-label="Seções">
      <button type="button" role="tab" data-tab="pauta" aria-selected="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>Pauta<span class="n" id="n-pauta"></span></button>
      <button type="button" role="tab" data-tab="creator" aria-selected="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Creator</button>
      <button type="button" role="tab" data-tab="sementes" aria-selected="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.8 7.8 10.6 16M16.2 7.8 13.4 16M8.5 6h7"/></svg>Sementes e referências</button>
    </nav>
  </aside>
  <div class="scrim-menu" id="scrim-menu"></div>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Abrir o menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="topbar-tit"><h1 id="titulo">Pauta</h1></div>
      <div class="topbar-dir">
        <button class="icon-btn" id="tema" type="button" title="Modo claro" aria-label="Modo claro"><svg class="i-sol" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-lua" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button class="icon-btn" id="reload" type="button" title="Recarregar" aria-label="Recarregar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></button>
        <div id="cx-ciclo"></div>
        <div id="cx-conta"></div>
      </div>
    </header>
    <div class="wrap">
      <div id="view-creator"></div>
    </div>
  </main>
</div>

<script src="/creator.js"></script>
<script>
(() => {
  // as tres abas sao desenhadas pelo creator.js; aqui so a troca de aba e o "recarregar"
  let tab = 'pauta';
  try { const t = localStorage.getItem('radar-tab'); if (window.Creator.isTab(t)) tab = t; } catch { /* sem storage */ }
  const hora = new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' });
  async function abrir(t) {
    tab = t;
    document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    try { localStorage.setItem('radar-tab', tab); } catch { /* sem storage */ }
    await window.Creator.render(tab);
    const T = { pauta: ['Pauta'], creator: ['Creator'], sementes: ['Sementes e referências'] };
    document.getElementById('titulo').textContent = T[tab][0];
    document.title = `${T[tab][0]} · Radar de conteúdo`;
    const r = document.getElementById('reload');
    r.title = `Recarregar · atualizado às ${hora.format(new Date())}`;
    r.setAttribute('aria-label', r.title);
    document.getElementById('app').classList.remove('menu-aberto');
  }
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]');
    if (b && b.dataset.tab !== tab) abrir(b.dataset.tab);
  });
  document.getElementById('reload').addEventListener('click', async (e) => {
    const b = e.currentTarget;
    b.disabled = true;
    b.classList.add('girando');
    try { await abrir(tab); } finally { b.disabled = false; b.classList.remove('girando'); }
  });
  // tema: segue o sistema ate a pessoa escolher; a escolha fica salva neste navegador
  const escuroNoSistema = window.matchMedia('(prefers-color-scheme: dark)');
  function temaAtual() {
    const t = document.documentElement.dataset.theme;
    return t === 'light' || t === 'dark' ? t : escuroNoSistema.matches ? 'dark' : 'light';
  }
  function desenharTema() {
    const claro = temaAtual() === 'light';
    document.documentElement.classList.toggle('tema-claro', claro);
    const b = document.getElementById('tema');
    b.title = claro ? 'Modo escuro' : 'Modo claro';
    b.setAttribute('aria-label', b.title);
  }
  document.getElementById('tema').addEventListener('click', () => {
    const novo = temaAtual() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = novo;
    try { localStorage.setItem('radar-tema', novo); } catch { /* sem storage */ }
    desenharTema();
  });
  escuroNoSistema.addEventListener('change', desenharTema);
  desenharTema();

  // menu no celular
  document.getElementById('menu-btn').addEventListener('click', () => document.getElementById('app').classList.add('menu-aberto'));
  document.getElementById('scrim-menu').addEventListener('click', () => document.getElementById('app').classList.remove('menu-aberto'));
  // o creator.js pede para trocar de aba (ex.: "Novo creator" leva para a aba Creator)
  document.addEventListener('creator:aba', (e) => { if (window.Creator.isTab(e.detail)) abrir(e.detail); });
  abrir(tab);
})();
</script>
</body>
</html>
